 if(!DB||!MYGAME||MYIDX<0)return;
 const ref=DB.doc("durakGames/"+MYGAME);
 try{
  await DB.runTransaction(async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists)throw new Error("Игра пропала");
   const d=snap.data();
   if(d.status!=="playing")throw new Error("Игра не идёт");
   if(d.turn!==MYIDX)throw new Error("Не ваш ход");
   const ns=pvpApply(d.state,MYIDX,action);
   const nt=ns.over?-1:(ns.phase==="attack"?ns.attacker:1-ns.attacker);
   const upd={state:ns,turn:nt,version:(d.version||0)+1};
   if(ns.over){upd.status="finished";upd.finishedAt=Date.now()}
   tx.update(ref,upd);
  });
 }catch(e){toast(e.message||"Ошибка хода")}
}
async function pvpClaim(){
 if(!DB||!MYGAME||MYIDX<0)return;
 const ref=DB.doc("durakGames/"+MYGAME);
 let shouldCredit=false,bet=0,over=0;
 try{
  await DB.runTransaction(async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists)return;
   const d=snap.data();
   over=d.state?.over||0;
   if(!over)return;
   const claimed=d.claimed||{};
   if(claimed[MYIDX])return;
   bet=d.bet;
   tx.update(ref,{claimed:{...claimed,[MYIDX]:true}});
   shouldCredit=true;
  });
 }catch(e){console.warn("claim",e);return}
 if(!shouldCredit)return;
 pvpCredited=true;
 if(over===1&&MYIDX===0){S.bal+=bet*2;save();toast("Вы выиграли "+f(bet*2))}
 else if(over===2&&MYIDX===1){S.bal+=bet*2;save();toast("Вы выиграли "+f(bet*2))}
 else if(over===3){S.bal+=bet;save();toast("Ничья, ставка возвращена")}
 else toast("Вы проиграли "+f(bet));
}

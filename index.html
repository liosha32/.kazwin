 else if(g=="mines"){const k=GM?GM.o.size:0;h=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">${Array.from({length:25},(_,i)=>{const o=GM&&GM.o.has(i),mn=GM&&GM.over&&GM.m.has(i);return B("gMopen("+i+")","",`style="padding:14px 0;${o?"background:#2a8a2a":mn?"background:#a22":""}" ${!act||o?"disabled":""}`)+(o?"💎":mn?"💣":"?")+"</button>"}).join("")}</div>`;
  h+=act?`${B("gMcash()","k",k?"":"disabled")}Забрать ${f(Math.floor(GM.b*gMul(k)))}</button>`:`${B("gMstart()","k")}${GM?"Играть снова":"Начать"}</button>`}
 $("#app").innerHTML=`<div class="p big">Баланс: ${f(S.bal)}</div>${g!="menu"?`<div class="p"><input id="gbi" type="text" inputmode="numeric" value="${GS.bet}" ${act?"disabled":""} oninput="gBet(this.value)" onchange="this.value=GS.bet"></div>`:""}${GS.msg?`<div class="p big">${GS.msg}</div>`:""}${h}${B(g=="menu"?"scr='main';render()":"gGo('menu')","g",GM&&!GM.over?"disabled":"")}Назад</button>`}

/* ============ ДУРАК (подкидной, против ИИ) ============ */
let DU=null;
const DSUITS=["♠","♥","♦","♣"],DRANK=["6","7","8","9","10","J","Q","K","A"];
const dNewDeck=()=>{const d=[];for(const s of DSUITS)for(const r of DRANK)d.push({s,r});for(let i=d.length-1;i>0;i--){const j=ri(i+1);[d[i],d[j]]=[d[j],d[i]]}return d};
const dVal=c=>DRANK.indexOf(c.r);
function dBeats(a,b,tr){if(a.s==b.s)return dVal(a)>dVal(b);return a.s==tr&&b.s!=tr}
function durakStart(){if(S.bal<1){toast("Нет денег");return}DU={deck:dNewDeck(),tr:null,p:[],c:[],table:[],att:true,over:false,bet:100};DU.tr=DU.deck[0];for(let i=0;i<6;i++){DU.p.push(DU.deck.pop());DU.c.push(DU.deck.pop())}
 scr="durak";render()}
function durakScr(){
 if(!DU)return durakStart();
 const card=(c,onclick,dis)=>`<div onclick="${onclick||""}" style="display:inline-flex;flex-direction:column;justify-content:space-between;width:46px;height:68px;padding:3px;box-sizing:border-box;border-radius:6px;margin:2px;background:#fff;color:${c.s=="♥"||c.s=="♦"?"#d11":"#111"};text-shadow:none;border:1px solid #999;font:700 16px/1 Georgia;cursor:${dis?"default":"pointer"};opacity:${dis?.5:1}"><span>${c.r}${c.s}</span><span style="align-self:flex-end">${c.r}${c.s}</span></div>`;
 let h=`<div class="p big">🃏 Дурак</div><div class="p">Козырь: <b style="color:${DU.tr.s=="♥"||DU.tr.s=="♦"?"#f88":"#8cf"}">${DU.tr.r}${DU.tr.s}</b> · Колода: ${DU.deck.length} · ${DU.att?"Вы атакуете":"ИИ атакует"}</div>`;
 h+=`<div class="p"><div>ИИ (${DU.c.length})</div><div>${DU.c.map(c=>card(c,"",true)).join("")}</div></div>`;
 h+=`<div class="p"><div>Стол:</div><div>${DU.table.map(t=>`${card(t.a,"",true)}${t.b?card(t.b,"",true):""}`).join("")||"—"}</div></div>`;
 h+=`<div class="p"><div>Вы (${DU.p.length})</div><div>${DU.p.map((c,i)=>card(c,`durakPlay(${i})`,DU.over||DU.p.length<1)).join("")}</div></div>`;
 h+=`<div class="row"><button class="b s" onclick="durakTake()">Взять</button><button class="b s" onclick="durakPass()">Бито</button><button class="b g s" onclick="scr='main';DU=null;render()">Выйти</button></div>`;
 $("#app").innerHTML=h}
function durakPlay(i){if(!DU||DU.over)return;const c=DU.p[i],tr=DU.tr.s;
 if(DU.att){if(!DU.table.length||DU.table.some(t=>!t.b)){const t=DU.table.find(t=>!t.b);if(t){if(dBeats(c,t.a,tr)){t.b=c;DU.p.splice(i,1)}else{toast("Не бьёт")}}}else{toast("Стол полон")}}
 else{const t=DU.table.find(t=>!t.b);if(!t){toast("Нечего бить");return}if(dBeats(c,t.a,tr)){t.b=c;DU.p.splice(i,1)}else toast("Не бьёт")}
 durakAI();render()}
function durakAI(){if(!DU||DU.over)return;
 if(DU.att){const cap=DU.p.length;while(DU.table.some(t=>!t.b)){const t=DU.table.find(t=>!t.b);const opts=DU.c.filter(c=>dBeats(c,t.a,DU.tr.s)).sort((a,b)=>dVal(a)-dVal(b));if(!opts.length)break;t.b=opts[0];DU.c.splice(DU.c.indexOf(opts[0]),1)}
  if(!DU.table.length){const c=DU.c.sort((a,b)=>dVal(a)-dVal(b))[0];if(c){DU.table.push({a:c,b:null});DU.c.splice(DU.c.indexOf(c),1)}}}
 else{let can=true;while(DU.table.some(t=>!t.b)&&can){const t=DU.table.find(t=>!t.b);const opts=DU.c.filter(c=>dBeats(c,t.a,DU.tr.s)).sort((a,b)=>dVal(a)-dVal(b));if(!opts.length)can=false;else{t.b=opts[0];DU.c.splice(DU.c.indexOf(opts[0]),1)}}}
 durakRefill();durakCheck()}
function durakRefill(){while(DU.p.length<6&&DU.deck.length)DU.p.push(DU.deck.pop());while(DU.c.length<6&&DU.deck.length)DU.c.push(DU.deck.pop())}
function durakCheck(){if(!DU.p.length&&!DU.deck.length){DU.over=true;const w=Math.floor(DU.bet*2);S.bal=Math.min(MAXSAFE,S.bal+w);save();toast("Вы победили! +"+f(w));durakScr();return}
 if(!DU.c.length&&!DU.deck.length){DU.over=true;S.bal=Math.max(0,S.bal-DU.bet);save();toast("ИИ победил −"+f(DU.bet));durakScr()}}
function durakTake(){if(!DU||DU.over)return;DU.p.push(...DU.table.map(t=>t.b).filter(Boolean),...DU.table.map(t=>t.a).filter(Boolean));DU.table=[];DU.att=true;durakRefill();durakAI();render()}
function durakPass(){if(!DU||DU.over||DU.table.some(t=>!t.b))return;DU.table=[];DU.att=!DU.att;durakAI();render()}

/* ============ ШАХМАТЫ (упрощённые, ходы мышью, ИИ-рандом) ============ */
let CH=null;
function chessStart(){if(S.bal<1){toast("Нет денег");return}CH={b:chessInit(),sel:null,turn:"w",over:false,bet:100};scr="chess";render()}
function chessInit(){return [
 ["r","n","b","q","k","b","n","r"],
 ["p","p","p","p","p","p","p","p"],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["P","P","P","P","P","P","P","P"],
 ["R","N","B","Q","K","B","N","R"]
]}
const isW=p=>p&&p===p.toUpperCase();
function chessScr(){if(!CH)chessStart();
 const col=S.chess||"Классические",it=ITEMS.chess[col]||{c:[200,180,140]};
 const light=`rgb(${Math.min(255,it.c[0]+40)},${Math.min(255,it.c[1]+40)},${Math.min(255,it.c[2]+40)})`,dark=`rgb(${it.c[0]},${it.c[1]},${it.c[2]})`;
 let h=`<div class="p big">♟ Шахматы</div><div class="p">Ход: ${CH.turn=="w"?"белые":"чёрные"}</div><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:0;border:2px solid #000">`;
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=CH.b[r][c],bg=(r+c)%2?light:dark;
  h+=`<div onclick="chessClick(${r},${c})" style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:${bg};font-size:26px;cursor:pointer">${p||""}</div>`}
 h+=`</div><div class="row"><button class="b s g" onclick="scr='main';CH=null;render()">Выйти</button></div>`;
 $("#app").innerHTML=h}
function chessClick(r,c){if(!CH||CH.over||CH.turn!="w")return;const p=CH.b[r][c];
 if(CH.sel){const[sr,sc]=CH.sel;if(sr==r&&sc==c){CH.sel=null;return}if(chessMove(sr,sc,r,c)){CH.sel=null;CH.turn="b";chessScr();setTimeout(chessAI,300)}else{toast("Нельзя")}return}
 if(p&&isW(p))CH.sel=[r,c];chessScr()}
function chessMove(fr,fc,tr,tc){const p=CH.b[fr][fc];if(!p)return false;if(CH.b[tr][tc]&&isW(CH.b[tr][tc])==isW(p))return false;
 // упрощённая проверка (без шахов/рокировок)
 const dr=tr-fr,dc=tc-fc,ap=p.toUpperCase();
 if(ap=="P"){const dir=isW(p)?-1:1;if(fc==tc&&!CH.b[tr][tc]&&dr==dir)return true;if(fc!=tc&&Math.abs(dc)==1&&dr==dir&&CH.b[tr][tc])return true;return false}
 if(ap=="N")return (Math.abs(dr)==2&&Math.abs(dc)==1)||(Math.abs(dr)==1&&Math.abs(dc)==2);
 if(ap=="B")return Math.abs(dr)==Math.abs(dc);
 if(ap=="R")return dr==0||dc==0;
 if(ap=="Q")return dr==0||dc==0||Math.abs(dr)==Math.abs(dc);
 if(ap=="K")return Math.max(Math.abs(dr),Math.abs(dc))==1;
 return false}
function chessAI(){if(!CH||CH.over)return;
 const moves=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=CH.b[r][c];if(p&&!isW(p)){for(let tr=0;tr<8;tr++)for(let tc=0;tc<8;tc++){if(!CH.b[tr][tc]||isW(CH.b[tr][tc])){const save=CH.b[tr][tc];CH.b[tr][tc]=p;if(chessMove(r,c,tr,tc))moves.push([r,c,tr,tc]);CH.b[tr][tc]=save}}}}
 if(!moves.length){CH.over=true;toast("ИИ не может ходить — ничья");chessScr();return}
 const m=moves[ri(moves.length)];CH.b[m[2]][m[3]]=CH.b[m[0]][m[1]];CH.b[m[0]][m[1]]="";CH.turn="w";chessScr()}

$("#app").innerHTML=`<div class="p">Загрузка…</div>`;apply();fx();
(async()=>{
 try{if(window.firebase&&FIREBASE_CONFIG.apiKey){firebase.initializeApp(FIREBASE_CONFIG);const cr=await to(firebase.auth().signInAnonymously(),8000);UID=cr.user.uid;DB=firebase.firestore()}}catch(e){DB=null}
  scr="auth";render()})();
setInterval(chk,20000);
addEventListener("pagehide",()=>{save();cloud()});
setInterval(()=>{if(scr=="main"&&st=="bet"&&!modal&&!document.activeElement.matches("input")&&!S.admin)main()},30000);
</script>
